<template id="regime-controls">
  <div class="regime-context">
    <p class="regime-intensity"></p>
    <p>Último registro de cada dia × hora UTC no recorte. Nenhuma média histórica.</p>
    <div class="regime-hours"><button type="button" data-step="-6" aria-label="Ver seis horas anteriores">←</button><span class="hours-label"></span><button type="button" data-step="6" aria-label="Ver seis horas seguintes">→</button></div>
    <p class="cell-readout" role="status"></p>
  </div>
</template>

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-extracao"
version = "0.3.0"
description = "Construtor de bases de dados do MetaTrader 5 (Windows e Linux)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["metatrader5", "mt5", "trading", "b3", "dados", "ohlcv"]
# Mantenha igual a requirements.txt (tests/test_packaging.py verifica)
dependencies = [
    "MetaTrader5>=5.0.45; sys_platform == \"win32\"",
    "rpyc==6.0.2; sys_platform != \"win32\"",
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "SQLAlchemy>=2.0,<2.1",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "psutil>=5.9",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
    "openpyxl>=3.1",
    "pytz>=2024.1",
    "tzlocal>=5.0",
    "requests>=2.31",
]

[project.optional-dependencies]
ta = ["pandas-ta"]
columnar = ["pyarrow", "duckdb"]
postgresql = ["psycopg[binary]"]
dev = ["pytest>=7.4", "pytest-timeout>=2.2", "pytest-cov>=4.1"]

[project.scripts]
mt5x = "mt5_extracao.cli:main"

[tool.setuptools.packages.find]
include = ["mt5_extracao*"]
